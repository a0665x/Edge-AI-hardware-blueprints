const CATALOG = [

{id:'inspection',group:'scene',name:'定點外觀檢查',short:'靜態 · 觸發推論',icon:'inspect',models:['yolo'],story:'產線工件停止或觸發曝光後，找出缺陷位置並標記待複檢。',pipeline:['觸發曝光','ROI','偵測／分割','複檢'],detail:'靜態不代表不即時：節拍仍有 deadline。缺陷太小時，先改善光學、打光或分塊，不能只提高 TOPS。',ref:'scenarios'},
{id:'document',group:'scene',name:'文件與儀表',short:'靜態 · 按需推論',icon:'document',models:['ocr'],story:'設備旁的讀表終端：拍攝、校正、辨識數值，再驗證格式。',pipeline:['取像','透視校正','OCR','規則驗證'],detail:'OCR 作為預設起點；只有遇到開放語意或複雜版面才加 VLM。驗收單位是欄位正確率與錯誤處置。',ref:'scenarios'},
{id:'points',group:'scene',name:'表面特徵點追蹤',short:'動態 · 時序狀態',icon:'points',models:['tapir'],story:'工作台上的軟質物件：使用者點選表面特徵，追蹤位置與遮擋狀態。',pipeline:['曝光','特徵點','線上追蹤','軌跡'],detail:'TAPNet 是專案系列；此處起測選 causal TAPIR。高 FPS 有助降低幀間位移，但不是所有點追蹤的固定要求。須定義速度、特徵大小、遮擋與點數。',ref:'algorithms'},
{id:'depthscene',group:'scene',name:'空間與距離',short:'動態 · 幾何估計',icon:'depth',models:['depth'],story:'倉庫走道：估計前景與背景關係，提示可能的近距離障礙。',pipeline:['影像','Depth Anything','尺度校正','距離判斷'],detail:'相對深度不等於公尺。若要距離精度與避障驗收，需度量模型、標定及感測器對照；不可直接作安全認證。',ref:'depth-decision'},
{id:'maskscene',group:'scene',name:'影片物件遮罩',short:'動態 · 可離線',icon:'mask',models:['sam'],story:'錄影檢閱：圈選一個物件，傳播遮罩並讓人員修正。',pipeline:['影片','提示','SAM 2','遮罩修正'],detail:'離線可用時間換品質；直播需檢查串流記憶體、重初始化、遮擋與端到端延遲。',ref:'algorithms'},
{id:'semantic',group:'scene',name:'事件語意判讀',short:'動態 · 事件觸發',icon:'chat',models:['yolo','vlm'],story:'工廠巡檢：偵測候選事件後，抽取關鍵影格，判讀是否需要人工處置。',pipeline:['輕量偵測','事件取樣','VLM','人工／規則'],detail:'VLM 放在慢速語意路徑；快速告警走確定性規則。回答需限制格式、拒答機制與誤判驗收。',ref:'pipeline'},
{id:'yolo',group:'model',name:'YOLO + 物件追蹤',short:'框選物件 · 保留 ID',icon:'box',detail:'YOLOv8n/s/m 640 輸入作容量起測，接 ByteTrack 或其他 MOT。檢查 Conv、Resize、Concat、輸出解碼、NMS 與 INT8 校正。模型代際與 export 不可混用。',ref:'algorithms'},
{id:'ocr',group:'model',name:'OCR',short:'找文字 · 讀欄位',icon:'document',detail:'文字偵測與辨識是兩段工作；裁切數量決定額外負載。先驗證斜角、反光、字元尺寸與業務格式。',ref:'algorithms'},
{id:'tapir',group:'model',name:'TAPIR / TAPNet',short:'逐點追蹤 · causal 版本',icon:'points',detail:'先固定 causal checkpoint、點數、輸入尺寸與 state。注意採樣、相關性運算、時序狀態及 GridSample 類匯出節點；實際圖以 export 為準。GPU 起測仍不能保證 Edge 即時。',ref:'algorithms',source:'https://github.com/google-deepmind/tapnet'},
{id:'cotracker',group:'model',name:'CoTracker',short:'多點共同追蹤 · 視窗',icon:'points',detail:'online 以 chunk/window 處理，不等於零等待。點數、滑動視窗、attention 與狀態增加記憶體及延遲。加入此卡代表與既有模型並存；可移除 TAPIR 以比較替代。',ref:'algorithms',source:'https://github.com/facebookresearch/co-tracker'},
{id:'sam',group:'model',name:'SAM 2',short:'提示分割 · 影片記憶',icon:'mask',detail:'encoder、prompt decoder 和 memory attention 需分別測試。A100 論文數據不能直接轉成 NPU 或 Jetson FPS。',ref:'algorithms',source:'https://github.com/facebookresearch/sam2'},
{id:'depth',group:'model',name:'Depth Anything',short:'深度估計 · 先定尺度',icon:'depth',detail:'本頁 DAC 依使用者定義對應 Depth Anything 系列。相對深度與 metric depth 分開；檢查 Resize、normalization、attention、輸出尺度。',ref:'depth-decision',source:'https://github.com/DepthAnything/Depth-Anything-V2'},
{id:'vlm',group:'model',name:'VLM 分類器',short:'影像語意 · 事件觸發',icon:'chat',detail:'從小型 VLM 起測，固定影像 token、上下文、量化與輸出長度。記錄首 token、完整回答延遲及峰值 RAM；勿用 detector FPS 估計。',ref:'depth-decision'},
{id:'jev',group:'model',name:'Jev / RLCD Qwen 決策',short:'本地決策 · 可選雲端 API',icon:'branch',detail:'依本工具需求，Jev 是以 RLCD + Qwen checkpoint 在本地做結構化決策；請指定參數規模、量化、runtime 和狀態預算。也可改為雲端 API，移除這個決策模型的本地運算負載，另驗證連線與服務延遲。',ref:'depth-decision',source:'https://github.com/QwenLM/Qwen3.8-Flash-Next'},
{id:'realtime',group:'need',name:'持續即時',short:'逐幀預算 · 端到端',icon:'clock',detail:'同時驗收 FPS、P95 延遲、最舊影格年齡與丟幀率。串流可 pipeline，吞吐與延遲不互相等價。',ref:'sizing'},
{id:'batch',group:'need',name:'離線批次',short:'允許等待 · 排程處理',icon:'document',detail:'不需要直播結果，但仍有每批完成時間、儲存和成本要求。可用較慢設備或分時處理。與「持續即時」同時選擇時需拆成兩條管線。',ref:'principles'},
{id:'private',group:'need',name:'完全離線',short:'資料與推論留在本機',icon:'lock',detail:'所有必要推論須可本地部署；服務 API 不符合。離線批次與完全離線是不同概念。',ref:'platforms'},
{id:'power',group:'limit',name:'整機功耗上限',short:'W · 含相機與載板',icon:'power',detail:'在池中設定整機瓦數。模組 power mode 不能當整機實測功耗；未知板卡不能宣稱通過。',ref:'platforms'},
{id:'camera',group:'limit',name:'相機與動作',short:'FPS · 曝光 · 特徵',icon:'camera',detail:'用真實相機 FPS、影像平面速度、曝光、目標像素及模型縮放後尺寸評估。插幀不能補回未拍到的觀測。',ref:'pipeline'},
{id:'multi',group:'limit',name:'多路相機',short:'同時輸入 · 頻寬',icon:'camera',detail:'路數會提高解碼、ISP、記憶體搬移與推論負載；也要查 board CSI/USB/以太網、同步和驅動。',ref:'sizing'},
{id:'fanless',group:'limit',name:'無風扇',short:'熱穩態 · 降頻',icon:'power',detail:'無風扇是整機散熱設計，不是 SoC 勾選項。必須以環溫、機殼與長時間 workload 實測。',ref:'validation'},
{id:'memory',group:'limit',name:'RAM 限制',short:'模型 + 狀態 + 系統',icon:'chip',detail:'設定可接受的實體 RAM 上限；實際可用量更少。模型載入成功不代表多路/長時運行不會 OOM。',ref:'sizing'},
{id:'latency',group:'limit',name:'反應時間',short:'相機 → 結果 P95',icon:'clock',detail:'定義端到端期限，包含曝光、排隊、搬移、模型和後處理；不能只看單模型 benchmark。',ref:'validation'}

const DEVICES=[

{id:'nx',name:'Jetson Orin NX 16GB',vendor:'NVIDIA',route:'CUDA / TensorRT',ram:16,minPower:null,family:'gpu',source:'https://developer.nvidia.com/embedded/jetson-modules',note:'適合先驗證多模型與客製算子路徑；仍需指定 JetPack、TensorRT、散熱與 power mode。'},
{id:'intel',name:'Core Ultra 工業電腦 / 64GB',vendor:'Intel',route:'OpenVINO · CPU / GPU / NPU',ram:64,minPower:null,family:'pc',source:'https://docs.openvino.ai/2026/openvino-workflow/running-inference/inference-devices-and-modes/npu-device.html',note:'64 GB 是本候選的規劃配置，產品族非固定 SKU。方便整合 x86 與多種 backend；NPU 相容性及 RAM／整機功耗須依機型查核。'},

{id:'kl',name:'KL730 評估板',vendor:'耐能 Kneron',route:'Kneron toolchain / NPU',ram:null,minPower:null,family:'npu',source:'https://doc.kneron.com/docs/toolchain/appendix/operators/',note:'先編譯固定形狀偵測模型；官方 op 表的 GridSample、NMS 限制須檢查，NMS 可另行評估 host 後處理。'}

{id:'obstacle',group:'scene',name:'移動機器人避障',short:'近距離精度 · 煞停距離',icon:'depth',models:['stereo'],story:'倉庫 AMR 遇到低矮物件，融合深度與里程資料，在可用距離內減速或停止。',pipeline:['Stereo / ToF','深度校正','障礙物','控制器'],detail:'要分段定義近／遠距誤差、最小障礙物、反光與低紋理失效模式；相對深度不能直接輸出可靠公尺。AI 與安全控制需分開驗收。',ref:'depth-decision'},
{id:'gimbaltrack',group:'scene',name:'雲台／移動相機追蹤',short:'FOV · 自身運動 · 同步',icon:'points',models:['tapir','stabilize'],story:'巡檢相機跟著目標轉動，先處理相機自轉與滾動快門，再追蹤表面特徵。',pipeline:['相機 + IMU','時間同步','穩定 / 補償','追蹤'],detail:'目標運動與相機運動須分開；gimbal 不代表完全無晃動。FOV、角速度、曝光與 timestamp 誤差都會改變輸入。',ref:'pipeline'},
{id:'voiceagent',group:'scene',name:'本地語音 Agent',short:'ASR → LLM → 工具 → TTS',icon:'chat',models:['llm','asr','tts'],story:'維修人員詢問設備故障；本機檢索手冊，Agent 準備工具操作並由人員確認。',pipeline:['VAD / ASR','本地 LLM + RAG','工具確認','串流 TTS'],detail:'500 ms 先定義成首個音訊還是完整回覆。模型、量化、context、prefill、endpointing、噪音與回音消除都需指定。預設參考 Strata 的 Qwen3.8 路徑。',ref:'pipeline'},
{id:'ragagent',group:'scene',name:'文件知識／工具 Agent',short:'本地 RAG · 工具白名單',icon:'branch',models:['llm','rag'],story:'工業終端回答維修問題，檢索本地文件並提出可核對的操作步驟。',pipeline:['檢索','LLM','結構化工具','確認 / 日誌'],detail:'回覆需有來源、無資料時拒答、工具權限與超時。模型推論只是延遲的一段；索引和文件也占用 RAM 與 SSD。',ref:'depth-decision'},
{id:'checkout',group:'scene',name:'結帳／訂單核對',short:'SKU · 遮擋 · OCR',icon:'box',models:['yolo','ocr'],story:'檢查餐盤或包裹中的物品，與訂單資料比對，將差異交由人員確認。',pipeline:['多角取像','偵測 + OCR','訂單比對','人工複核'],detail:'參考 Intel 零售 order-accuracy 管線；相似包裝、反光、重疊與未知 SKU 是主要限制。',ref:'scenarios'},
{id:'security',group:'scene',name:'智慧安防攝影機',short:'夜間 · 廣角 · 告警',icon:'camera',models:['yolo'],story:'低功耗廣角攝影機先做影像校正，再產生區域入侵或人車事件。',pipeline:['ISP / 廣角校正','物件偵測','事件規則','告警'],detail:'參考 Kneron IP camera 與 Ambarella security 產品方向；需查低照度、魚眼變形、編碼及全天候溫度。',ref:'platforms'},
{id:'pose',group:'scene',name:'姿態／動作分析',short:'關節點 · 遮擋 · 隱私',icon:'people',models:['posemodel'],story:'工作站以骨架關節評估動作，避免持續保存可辨識人臉的原始影片。',pipeline:['人員偵測','姿態估計','時間序列','動作事件'],detail:'先定義關節誤差、遮擋和多人體相互影響；骨架不代表沒有個資風險。',ref:'scenarios'},
{id:'stereo',group:'model',name:'Stereo / ToF 深度',short:'度量距離 · 需校正',icon:'depth',detail:'選雙目／ToF／RGB-D 感測路徑；焦距、baseline、同步與深度不確定性決定公尺精度。影像處理負載與裝置接入分別驗證。',ref:'depth-decision'},
{id:'stabilize',group:'model',name:'運動補償／IMU 融合',short:'相機自身運動 · 同步',icon:'camera',detail:'用標定、IMU、global motion 或光流估計相機運動；rolling shutter 和時間戳偏差仍需驗證。',ref:'pipeline'},
{id:'llm',group:'model',name:'本地 LLM / Strata',short:'模型 · 量化 · RAM / VRAM',icon:'chat',detail:'預設以 Strata 作 Qwen3.8-Flash-Next 的本地路徑，經相容 API 接 Agent。GPU expert cache、CPU/RAM 與 SSD embedding 分層；桌機結果不能當 Jetson benchmark。',ref:'depth-decision',source:'https://github.com/Niko1221/Strata'},

ted':''}>${L('此產品不需要','Not needed for this product')}</option></select></label>${!available&&needed?`<label class="pw-route-label">${L('工作交給','Route work to')}<select id="pw-route-${r.id}" data-pw-route="${r.id}"><option value="" ${a.mode==='unassigned'?'selected':''}>${L('待指派','Unassigned')}</option>${W.roles.filter(o=>state.available[o.id]&&o.id!==r.id).map(o=>`<option value="merge:${o.id}" ${a.mode==='merge'&&a.owner===o.id?'selected':''}>${E(label(o))} · ${L('兼任','Merged')}</option>`).join('')}<option value="si" ${route.mode==='si'?'selected':''}>${L('委外 SI / 供應商','External SI / supplier')}</option></select></label>${route.mode==='si'?`<label class="pw-route-label">${L('供應商／SI 名稱','Supplier / SI name')}<input id="pw-si-${r.id}" data-pw-partner="${r.id}" maxlength="100" value="${E(route.partner||'')}" placeholder="${L('請指定承接公司','Name the delivery partner')}"></label>`:''}<div>${badge(a)}</div>`:''}</div>`;}).join('')}</div><p class="pw-note">${L('兼任是分工提案，不代表承接者已具備能力或工時。SI 負責執行，公司仍保留 A（最終負責／放行）與交付驗收。','Merged roles are proposals, not proof of capability or capacity. SI can execute; internal A retains accountability and acceptance.')}</p></details>`;}
  function scopeOptions(){const defs=[['vision','遠距／移動取像','Long-range / moving camera'],['speech','語音互動','Voice interaction'],['cloud','雲端 API','Cloud API'],['mobile','移動控制／避障','Motion control / avoidance']];return `<div class="pw-scope"><strong>${L('產品範圍 · 額外工作','Product scope · additional work')}</strong>${defs.map(([id,zh,en])=>{const imported=!!state.snapshot?.flags?.[id],active=imported||state.extras[id];return `<button id="pw-scope-${id}" data-pw-scope="${id}" aria-pressed="${active}" ${imported?'disabled':''}>${L(zh,en)}${imported?' · '+L('選型帶入','Imported'):''}</button>`;}).join('')}${help('這一列代表產品功能範圍，會新增特定工作；與上方公司角色是否存在不同。選型帶入的範圍需回選型頁修改。','These buttons define product scope and add relevant tasks. They do not represent role availability. Change imported scope in the selection workbench.')}</div>`;}
  function stageButton(id,e){const p=e.phases.find(p=>p.id===id),tone=p.ownershipGaps?'gap':p.passed?'passed':'pending';return `<button id="pw-phase-${id}" class="pw-phase ${tone} ${state.selectedPhase===id?'active':''}" data-pw-phase="${id}" aria-pressed="${state.selectedPhase===id}" data-pw-help="${E(p[lang==='en'?'gateEn':'gateZh'])}"><span>${id.toUpperCase()}</span><b>${E(label(p))}</b><small>${p.ownershipGaps?`${p.ownershipGaps} ${L('項分工缺口','ownership gaps')}`:p.passed?L('依填寫證據可放行','Ready from entered evidence'):`${p.done}/${p.total} ${L('已填驗收','accepted entries')}`}</small></button>`;}
  function lifecycle(e){return `<section class="pw-lifecycle"><div class="pw-heading"><h2>${L('建議工作流程','Suggested workflow')}</h2><span>${e.rows.length} ${L('項工作','tasks')} · ${e.gaps} ${L('項責任缺口','ownership gaps')}</span></div><div class="pw-stage-tabs">${e.phases.map(p=>`<button id="pw-phase-${p.id}" data-pw-phase="${p.id}" aria-pressed="${state.selectedPhase===p.id}">${E(label(p))}${p.ownershipGaps?' · !':''}</button>`).join('')}</div></section>`;}
  function taskCard(t){return `<button class="pw-task" data-pw-task="${t.id}"><span class="pw-task-state ${t.complete?'done':t.missing.length||!t.a?'gap':''}">${t.complete?'✓':t.missing.length||!t.a?'!':'○'}</span><span><b>${E(label(t))}</b><small>${E(t[lang==='en'?'deliverEn':'deliverZh'])}</small><span class="pw-badges">${t.assignments.map(badge).join('')}</span></span><span>↗</span></button>`;}
  function phaseDetail(e){const p=e.phases.find(p=>p.id===state.selectedPhase);const currentA=state.accountable[p.id];return `<section class="pw-phase-detail"><div class="pw-heading"><div><span class="pw-eyebrow">${p.id.toUpperCase()} · ${L('交付與放行','DELIVERY & GATE')}</span><h2>${E(label(p))}</h2><p>${E(p[lang==='en'?'gateEn':'gateZh'])}</p></div><label class="pw-a-label">A · ${L('公司內部最終負責人','Internal accountable owner')}${help('每個階段只有一個 A；下方各工作繼承這個 A。PM 缺席不會自動把責任轉給其他人，請明確選擇。','One A per phase, inherited by its tasks. Removing PM does not silently transfer accountability; select an internal owner.')}<select id="pw-a-${p.id}" data-pw-accountable="${p.id}">${availabilityOptions(state.available[currentA]?currentA:'')}</select></label></div><div class="pw-gate-status ${p.passed?'passed':p.ownershipGaps?'gap':''}"><b>${p.passed?L('依使用者填寫，階段可放行','Ready according to entered evidence'):p.ownershipGaps?L('先補齊 R／A','Resolve R / A first'):p.ready&&!p.dependencies?L('工作已填驗收，等待前置階段','Entries accepted; awaiting predecessors'):L('分工已安排，交付待驗收','Ownership assigned; acceptance pending')}</b><span>${p.done}/${p.total} ${L('項具備責任與驗收證據','items with ownership and acceptance evidence')}</span>${!p.dependencies?`<small>${L('前置階段','Predecessors')}: ${p.deps.map(id=>id.toUpperCase()).join(' + ')}</small>`:''}</div><div class="pw-task-grid">${p.rows.map(taskCard).join('')}</div><p class="pw-note">${L('點工作卡檢視 RACI、交付清單與驗收證據。填寫「已驗收」代表使用者紀錄，系統沒有執行硬體測試或簽核。','Open a task for RACI, deliverables and acceptance evidence. Accepted is a user entry; this tool performs no hardware tests or sign-off.')}</p></section>`;}
  function sankey(e){
   const positions={scope:[20,45],design:[350,45],evt:[680,45],dvt:[1010,45],pvt:[1010,290],oob:[1010,490],mp:[680,390],ops:[350,390]};
   const lines=[['scope','design','M280 115H350'],['design','evt','M610 115H680'],['evt','dvt','M940 115H1010'],['dvt','pvt','M1140 185V290'],['dvt','oob','M1270 115H1305V560H1270'],['pvt','mp','M1010 360H975V460H940'],['oob','mp','M1010 560H975V460H940'],['mp','ops','M680 460H610']];
   let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 720" role="group" aria-labelledby="pw-sankey-title"><title id="pw-sankey-title">${L('產品工作流程與團隊責任','Product workflow and team ownership')}</title><defs><marker id="pw-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#638174"/></marker></defs>`;
   for(const [a,b,d] of lines){const ready=e.phases.find(p=>p.id===a).passed;svg+=`<g><title>${a.toUpperCase()} → ${b.toUpperCase()} · ${L(ready?'前置驗收已填寫':'待前置驗收',ready?'Predecessor accepted':'Awaiting predecessor acceptance')}</title><path d="${d}" fill="none" stroke="#a4b9ad" stroke-width="2" marker-end="url(#pw-arrow)"/><path class="pw-photon ${ready?'ready':''}" d="${d}" fill="none" stroke="${ready?'#00846b':'#7b9e90'}" stroke-width="4" stroke-dasharray="3 28"/></g>`;}
   svg+=`<path d="M480 530V660H150V185" fill="none" stroke="#638174" stroke-dasharray="6 5" marker-end="url(#pw-arrow)"/><path class="pw-photon" d="M480 530V660H150V185" fill="none" stroke="#638174" stroke-width="3" stroke-dasharray="3 28"/><text x="180" y="688" font-size="14" fill="#53685e">${L('現場回饋 → 下一版需求','Field feedback → next-version scope')}</text><path d="M1140 45V15H810V45" fill="none" stroke="#b18146" stroke-dasharray="5 5" marker-end="url(#pw-arrow)"/><text x="845" y="36" font-size="12" fill="#8a602e">${L('驗證未過 → 修正／重測','Validation fails → revise / retest')}</text>`;
   for(const p of e.phases){const [x,y]=positions[p.id],functions=[...new Set(p.rows.flatMap(t=>t.functions))];const absent=functions.filter(id=>!state.available[id]);const tags=functions.map(id=>`<span style="border-color:${color(id)}" tabindex="0" role="button" data-pw-help="${E(roleHelp(id))}" aria-label="${E(roleHelp(id))}">${id.toUpperCase()}${!state.available[id]?' !':''}</span>`).join('');svg+=`<foreignObject x="${x}" y="${y}" width="260" height="140"><div xmlns="http://www.w3.org/1999/xhtml" data-pw-node="${p.id}" class="pw-flow-node ${absent.length?'has-gap':''}"><button data-pw-phase="${p.id}" aria-pressed="${state.selectedPhase===p.id}" data-pw-help="${E(p[lang==='en'?'gateEn':'gateZh']+' · '+p.rows.map(t=>label(t)).join(' / '))}"><span class="pw-node-roles">${tags}</span><b>${E(label(p))}</b><span class="pw-node-meta">${absent.length?missing():''}<span class="pw-phase-status ${p.rows.some(t=>t.status==='active')?'is-active':''}">${phaseStatus(p)}</span></span>${p.rows.some(t=>t.when!=='always')?`<span class="pw-node-specific">${E(p.rows.filter(t=>t.when!=='always').map(t=>label(t)).join(' · '))}</span>`:''}</button></div></foreignObject>`;}
   svg+='</svg>';return `<section class="pw-routing"><div class="pw-heading"><b>${L('流程 × 角色','Workflow × roles')}</b>${help('右上角標籤是工作需要的角色。! 表示公司缺少此角色，即使安排兼任或委外仍保留人力缺口。流光表示驗證方向，不代表已完成；點節點查看工作。PVT 與 OOB 兩路驗收後才能 MP。','Upper-right tags show required roles. ! means the role is absent in-house, even with merged or external coverage. Moving lights indicate verification direction, not completion. Select a node for tasks. Both PVT and OOB must pass before MP.')}</div><div class="pw-sankey">${svg}</div><div class="pw-flow-legend"><span>→ ${L('驗證順序','Verification order')}</span><span>↶ ${L('修正／下一版','Rework / next cycle')}</span>${missing()}<button data-pw-action="motion" aria-pressed="${paused}">${L(paused?'播放流線':'暫停流線',paused?'Play flow':'Pause flow')}</button></div></section>`;
  }
  function raci(e){const rows=showAll?e.rows:e.rows.filter(t=>t.phase===state.selectedPhase);const term={R:L('Responsible：執行與交付，可以多人；合併後會去除重複承接者。','Responsible: executes and delivers; multiple owners allowed, deduplicated after merging.'),A:L('Accountable：公司內部最終負責與放行，單一角色。','Accountable: one internal owner for accountability and acceptance.'),C:L('Consulted：事前提供專業意見；缺席需安排諮詢。','Consulted: provides input before decisions; missing expertise needs coverage.'),I:L('Informed：知道決策、版本與交付結果。','Informed: receives decisions, versions and delivery results.')};return `<section class="pw-raci"><div class="pw-heading"><div><span class="pw-eyebrow">${L('逐項對齊','ALIGN EACH ITEM')}</span><h2>${L('工作 × RACI','Work × RACI')}</h2></div><button id="pw-raci-all" data-pw-action="raci-all" aria-pressed="${showAll}">${showAll?L('只看目前階段','Current phase only'):L('查看全部工作','View all work')}</button></div><div class="pw-raci-legend">${Object.entries(term).map(([k,v])=>`<button data-pw-help="${E(v)}"><b>${k}</b> ${E(v.split('：')[0].split(':')[0])}</button>`).join('')}</div><div class="pw-table-scroll" tabindex="0" aria-label="${L('RACI 表，可橫向捲動','RACI table, horizontally scrollable')}"><table><caption>${showAll?L('全部階段','All phases'):state.selectedPhase.toUpperCase()} · ${rows.length} ${L('項工作；A 由階段負責人設定','tasks; A is set by phase ownership')}</caption><thead><tr><th scope="col">${L('工作／交付','Work / deliverable')}</th><th scope="col">R ${L('執行','Executes')}</th><th scope="col">A ${L('最終負責','Accountable')}</th><th scope="col">C ${L('諮詢','Consulted')}</th><th scope="col">I ${L('知會','Informed')}</th><th scope="col">${L('工作狀態（可修改）','Work status (editable)')}</th></tr></thead><tbody>${rows.map(t=>{const owners=[...new Set(t.assignments.map(a=>a.valid?a.mode==='si'?'SI · '+a.partner:roleLabel(a.owner):L('待指派','Unassigned')))];const consultants=[...new Set(t.consultants.map(a=>a.valid?a.mode==='si'?'SI · '+a.partner:roleLabel(a.owner):roleLabel(a.function)+' · '+L('! 缺人','! Missing role')))];return `<tr data-pw-row-phase="${t.phase}" class="${t.missing.length||!t.a?'pw-row-gap':''}"><th scope="row"><button data-pw-task="${t.id}">${E(label(t))}</button><small>${t.phase.toUpperCase()}</small></th><td>${t.assignments.map(a=>badge(a)).join('')}</td><td>${t.a?E(roleLabel(t.a)):missing()+' A'}</td><td>${consultants.map(o=>`<span>${o.includes('!')?missing():''}${E(o)}</span>`).join('')}</td><td>${E(roleLabel('exec'))}</td><td>${statusSelect(t,'raci-status')}<button class="pw-locate" data-pw-locate="${t.phase}">${L('定位流程 ↗','Locate in flow ↗')}</button>${t.status==='done'&&!t.complete?`<small>${L('尚缺證據或責任','Evidence or ownership missing')}</small>`:''}</td></tr>`;}).join('')}</tbody></table></div>${e.unknownConsultations?`<p class="pw-note">${e.unknownConsultations} ${L('項工作尚有諮詢職能缺口；沒有因為角色未勾選而刪除。','tasks have consultation gaps; unavailable roles were not silently removed.')}</p>`:''}</section>`;}
  function taskDrawer(e){if(!openTask)return '';const t=e.rows.find(t=>t.id===openTask);if(!t)return '';const external=t.assignments.some(a=>a.mode==='si');return `<aside class="pw-drawer" role="dialog" aria-modal="false" aria-labelledby="pw-task-title"><div class="pw-heading"><div><span class="pw-eyebrow">${t.phase.toUpperCase()}</span><h2 id="pw-task-title">${E(label(t))}</h2></div><button id="pw-close" data-pw-action="close" aria-label="${L('關閉工作詳情','Close task details')}">×</button></div><h3>${L('誰交付，誰放行','Who delivers, who accepts')}</h3><div class="pw-badges">${t.assignments.map(badge).join('')}</div><p>A · ${E(t.a?roleLabel(t.a):L('請到本階段指派內部 A','Assign an internal A for this phase'))}</p><h3>${L('交付物','Deliverables')}</h3><p>${E(t[lang==='en'?'deliverEn':'deliverZh'])}</p><h3>${L('驗收準則','Acceptance criteria')}</h3><p>${E(t[lang==='en'?'acceptEn':'acceptZh'])}</p>${state.snapshot?`<p class="pw-note">${L('以目前選型基線的參數與未解限制補入測試計畫；完整數值見匯出 JSON。','Use imported parameters and open issues in the test plan; full values are in exported JSON.')}</p>`:''}${external?`<div class="pw-si-contract"><h3>${L('委外交付界面','External delivery contract')}</h3><p>${L('在 SOW 明訂：範圍與不含項、原始碼／BOM／治具及 IP 權利、版本與重建環境、測試資料與報告、驗收門檻、變更／保固／維修窗口。','Define scope/exclusions, source/BOM/fixtures and IP rights, versions/rebuild environment, test data/reports, acceptance thresholds and change/warranty/service contacts in the SOW.')}</p></div>`:''}<label>${L('工作狀態','Task status')}<select id="pw-status-${t.id}" data-pw-status="${t.id}">${[['planned','待開始','Planned'],['active','進行中','In progress'],['review','待複核','In review'],['done','已驗收（使用者紀錄）','Accepted (user entry)']].map(([v,z,en])=>`<option value="${v}" ${t.status===v?'selected':''}>${L(z,en)}</option>`).join('')}</select></label><label>${L('驗收證據／簽核紀錄','Acceptance evidence / sign-off record')}<textarea id="pw-evidence-${t.id}" data-pw-evidence="${t.id}" rows="4" maxlength="4000" placeholder="${L('報告位置、版本、結果、複核者與日期','Report reference, version, result, reviewer and date')}">${E(t.evidence)}</textarea></label>${t.status==='done'&&!t.complete?`<p class="pw-warning">${L('需要完整 R、內部 A 與非空白驗收證據，才會計入階段完成。','Complete R, internal A and nonempty evidence are required to count this task as accepted.')}</p>`:''}<p class="pw-note">${L('證據欄僅保存文字參照，不會開啟、上傳或驗證外部檔案。','Evidence is a text reference only; external files are not opened, uploaded or validated.')}</p></aside>`;}

function switchWorkbenchTab(tab,focus=false){
 const delivery=tab==='delivery';$('selectionPanel').hidden=delivery;$('deliveryPanel').hidden=!delivery;
 for(const id of ['selection','delivery']){const btn=$(id+'Tab');btn.setAttribute('aria-selected',String((id==='delivery')===delivery));btn.tabIndex=((id==='delivery')===delivery)?0:-1;}
 if(delivery){if(!deliveryController){deliveryController=ProductWorkflowUI.mount($('deliveryRoot'),{language:()=>locale,snapshot:deliverySnapshot,makeLocal(){remember();params={...params,llmPlacement:'local',decisionPlacement:'local'};pool.add('private');render();deliveryController.refreshContext();}});deliveryController.importSelection();}else deliveryController.refreshContext();}
 hideTip();closeDrawer();if(focus)$(delivery?'deliveryTab':'selectionTab').focus();
 try{window.history.replaceState(null,'',delivery?'#delivery':'#selection');}catch{}
}
function initializeDeliveryTabs(){
 $('selectionTab').addEventListener('click',()=>switchWorkbenchTab('selection'));

 $('workbenchTabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const target=event.key==='Home'?'selection':event.key==='End'?'delivery':$('deliveryPanel').hidden?'delivery':'selection';switchWorkbenchTab(target,true);});

}
